name: omnivoice-intel
channels:
  - conda-forge
dependencies:
  # PyTorch 2.2.2 is the last official macOS x86_64 release line.
  # Python 3.11 has a matching macOS x86_64 wheel for torch/torchaudio 2.2.2.
  - python=3.11
  - ffmpeg>=7,<9
  - libsndfile>=1.2
  - pip>=25
  - pip:
      - "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'"
      - "torchaudio==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'"
      # 4.43.x still recognizes PyTorch 2.2.x. Newer Transformers releases
      # moved their supported PyTorch floor to 2.4.
      # NOTE: this is intentionally experimental: OmniVoice currently also
      # needs Qwen3 + HiggsAudioV2TokenizerModel, which landed after this line.
      - "transformers==4.43.4"
      - "accelerate>=0.33,<2"
      - pydub
      - gradio
      - fastapi
      - uvicorn
      - tensorboardX
      - webdataset
      - "numpy<2"
      - soundfile
      - librosa

# Install OmniVoice itself after creating this environment so pip does not
# re-resolve pyproject.toml's normal torch>=2.4 / transformers>=5.3 constraints:
#
#   conda env create -f environment-intel.yml
#   conda activate omnivoice-intel
#   python -m pip install --no-deps -e .
#   python scripts/check_macos_intel_compat.py
