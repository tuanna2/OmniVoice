name: omnivoice-intel
channels:
  - conda-forge
dependencies:
  # PyTorch 2.2.2 is the last official macOS x86_64 release line.
  # Python 3.11 has matching macOS x86_64 wheels for torch/torchaudio 2.2.2.
  - python=3.11
  - ffmpeg>=7,<9
  - libsndfile>=1.2
  - pip>=25
  - pip:
      - "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'"
      - "torchaudio==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'"
      # Keep current OmniVoice model support (Qwen3 + Higgs Audio V2) and
      # deliberately run Transformers 5.3 on the older Intel-compatible Torch.
      # Transformers does not install torch as a hard dependency; its normal
      # torch>=2.4 floor is used by the optional torch extra/support policy.
      - "transformers==5.3.0"
      - "accelerate>=1.1,<2"
      - pydub
      - gradio
      - fastapi
      - uvicorn
      - tensorboardX
      - webdataset
      - "numpy<2"
      - soundfile
      - librosa

# Install OmniVoice itself without re-resolving pyproject.toml's normal
# torch>=2.4 constraint:
#
#   conda env create -f environment-intel.yml
#   conda activate omnivoice-intel
#   python -m pip install --no-deps -e .
#   python scripts/check_macos_intel_compat.py
