name: omnivoice-intel
channels:
  - conda-forge
dependencies:
  # PyTorch 2.2.2 is the last official macOS x86_64 release line.
  # Python 3.11 has matching macOS x86_64 wheels for torch/torchaudio 2.2.2.
  - python=3.11
  - ffmpeg>=7,<9
  - libsndfile>=1.2
  - pip>=25
  - pip:
      - "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'"
      - "torchaudio==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'"
      # Last convenient Numba/llvmlite pair with CPython 3.11 macOS x86_64 wheels.
      # Newer llvmlite falls back to a local LLVM build on Intel macOS.
      - "numba==0.60.0; sys_platform == 'darwin' and platform_machine == 'x86_64'"
      - "llvmlite==0.43.0; sys_platform == 'darwin' and platform_machine == 'x86_64'"
      # Keep current OmniVoice model support (Qwen3 + Higgs Audio V2).
      - "transformers==5.3.0"
      - "accelerate>=1.1,<2"
      - pydub
      - gradio
      - fastapi
      - uvicorn
      - tensorboardX
      - webdataset
      - "numpy<2"
      - soundfile
      - "librosa==0.11.0"

# Transformers 5.3 disables its PyTorch backend for torch<2.4 and assumes a
# few post-2.2 APIs. Intel macOS cannot install >=2.3 from official wheels, so
# apply the narrow compatibility shim after creating the environment:
#
#   conda env create -f environment-intel.yml
#   conda activate omnivoice-intel
#   python scripts/patch_transformers_torch22.py
#
# Then install OmniVoice without re-resolving pyproject.toml's torch>=2.4:
#
#   python -m pip install --no-deps -e .
#   python scripts/check_macos_intel_compat.py
