name: macOS Intel compatibility

on:
  push:
    branches:
      - experiment/macos-intel-torch-2.2.2
  workflow_dispatch:

jobs:
  smoke-test:
    # macos-13 was retired in Dec 2025. This is GitHub's current standard
    # x86_64 runner, so the job really exercises Intel macOS.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Verify Intel runner
        run: |
          sw_vers
          uname -a
          test "$(uname -m)" = "x86_64"

      - name: Install PyTorch 2.2.2 for Intel macOS
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.2.2 torchaudio==2.2.2 'numpy<2'

      - name: Force current OmniVoice userspace on Torch 2.2.2
        run: |
          # Transformers' torch floor is not a hard install dependency. Keep
          # v5.3 so Qwen3 + HiggsAudioV2TokenizerModel remain available and
          # probe the actual runtime compatibility against torch 2.2.2.
          python -m pip install \
            transformers==5.3.0 \
            'accelerate>=1.1,<2' \
            pydub gradio fastapi uvicorn tensorboardX webdataset \
            soundfile librosa
          python -m pip install --no-deps -e .

      - name: Show resolved versions
        run: |
          python -m pip freeze | grep -E '^(torch|torchaudio|transformers|accelerate|numpy)==' || true

      - name: Probe OmniVoice compatibility
        run: python scripts/check_macos_intel_compat.py
