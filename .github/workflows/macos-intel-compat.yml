name: macOS Intel compatibility

on:
  push:
    branches:
      - experiment/macos-intel-torch-2.2.2
  workflow_dispatch:

jobs:
  smoke-test:
    # macos-15-intel is GitHub's current standard x86_64 macOS runner.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Verify Intel runner
        run: |
          sw_vers
          uname -a
          test "$(uname -m)" = "x86_64"

      - name: Install PyTorch 2.2.2 for Intel macOS
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.2.2 torchaudio==2.2.2 'numpy<2'

      - name: Force current OmniVoice userspace on Torch 2.2.2
        run: |
          python -m pip install \
            transformers==5.3.0 \
            'accelerate>=1.1,<2' \
            pydub gradio fastapi uvicorn tensorboardX webdataset \
            soundfile librosa

          # Transformers 5.3 intentionally disables its PyTorch model backend
          # below torch 2.4. Intel macOS cannot install that floor from official
          # wheels, so lower only the availability gate and test the real APIs.
          python scripts/patch_transformers_torch22.py

          # Avoid pyproject.toml re-resolving torch>=2.4.
          python -m pip install --no-deps -e .

      - name: Show resolved versions
        run: |
          python -m pip freeze | grep -E '^(torch|torchaudio|transformers|accelerate|numpy)==' || true

      - name: Probe OmniVoice compatibility
        run: python scripts/check_macos_intel_compat.py
