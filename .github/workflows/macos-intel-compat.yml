name: macOS Intel compatibility

on:
  push:
    branches:
      - experiment/macos-intel-torch-2.2.2
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install experimental Intel runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            torch==2.2.2 \
            torchaudio==2.2.2 \
            transformers==4.43.4 \
            'accelerate>=0.33,<2' \
            pydub gradio fastapi uvicorn tensorboardX webdataset \
            'numpy<2' soundfile librosa
          python -m pip install --no-deps -e .

      - name: Show resolved versions
        run: |
          python -m pip freeze | grep -E '^(torch|torchaudio|transformers|accelerate|numpy)==' || true

      - name: Probe OmniVoice compatibility
        run: python scripts/check_macos_intel_compat.py
